name: ANDREAO Fleet v3.4 - automatico Wi-Fi autorizado
on:
  push:
    branches:
      - feature/andreao-fleet-auto-wifi-v34-20261118
    paths:
      - android-fleet/v34/**
      - .github/workflows/android-fleet-auto-v34.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: '8.9'}
      - name: Recover v3.2 remote source
        run: |
          mkdir -p "$RUNNER_TEMP/fleet-remote-src"
          base64 --decode android-fleet/remote-v32/overlay.tar.xz.b64 | tar -xJ -C "$RUNNER_TEMP/fleet-remote-src"
          python3 "$RUNNER_TEMP/fleet-remote-src/apply_to_existing_project.py" android-fleet
      - name: Integrate v3.3 BYD telemetry
        run: |
          cp android-fleet/v33/FleetTelemetryReadOnly.java android-fleet/app/src/main/java/br/com/andreao/fleetprobe/
          cp android-fleet/v33/FleetTelemetryActivity.java android-fleet/app/src/main/java/br/com/andreao/fleetprobe/
          python3 android-fleet/v33/apply_v33.py android-fleet
      - name: Add v3.4 approved Wi-Fi job
        run: |
          cp android-fleet/v34/FleetWifiAutoSyncJob.java android-fleet/app/src/main/java/br/com/andreao/fleetprobe/
          python3 android-fleet/v34/apply_v34.py android-fleet
          grep -Fq "NETWORK_TYPE_UNMETERED" android-fleet/app/src/main/java/br/com/andreao/fleetprobe/FleetWifiAutoSyncJob.java
      - name: Install Android SDK 35
        run: |
          SDK_MANAGER="$(command -v sdkmanager || find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -1)"
          "$SDK_MANAGER" 'platforms;android-35' 'build-tools;35.0.0'
      - name: Compile one integrated APK
        run: gradle -p android-fleet --no-daemon :app:assembleDebug
      - name: Validate existing functional contracts
        run: node --test tests/fleet-diagnostic-contract.test.mjs tests/fleet-tracker-contract.test.mjs
      - name: Check security defaults
        run: |
          python3 - <<'PY'
          from pathlib import Path
          src=Path('android-fleet/app/src/main/java/br/com/andreao/fleetprobe/FleetWifiAutoSyncJob.java').read_text()
          for s in ('NETWORK_TYPE_UNMETERED','NET_CAPABILITY_NOT_METERED','TRANSPORT_CELLULAR','TRANSPORT_VPN','isInteractive()','setPersisted(false)','connectedSsid'):
              assert s in src,s
          for s in ('startPreview(', 'getCameraId(', 'setInt(', 'WakeLock.acquire(', 'adb connect'):
              assert s not in src,s
          assert 'BIND_JOB_SERVICE' in Path('android-fleet/app/src/main/AndroidManifest.xml').read_text()
          telem=Path('android-fleet/app/src/main/java/br/com/andreao/fleetprobe/FleetTelemetryReadOnly.java').read_text()
          assert 'STATISTIC_BATTERY_HEALTHY_INDEX' in telem
          assert 's.soh=range(fid(manager' in telem
          print('Fail-closed source controls verified; BYD hardware not yet validated')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: ANDREAO-Fleet-v3.4-APK-Integrado
          path: android-fleet/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
