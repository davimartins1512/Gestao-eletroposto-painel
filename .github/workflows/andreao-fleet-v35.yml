name: ANDREAO Fleet - homologacao software integrado v3.5
on:
  push:
    branches:
      - feature/andreao-fleet-remote-v35-20261118
    paths:
      - fleet-remote-v35/**
      - .github/workflows/andreao-fleet-v35.yml
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  remote-backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Restore remote backend from verified source bundle
        run: |
          set -euo pipefail
          base64 --decode fleet-remote-v35/server-sources.tar.xz.b64 > "$RUNNER_TEMP/fleet-server.txz"
          echo "afa3235d6adf6c969e09d8ad49d992d4b4a9d5fd5712b2bb5abbfd2d34e6a0f1  $RUNNER_TEMP/fleet-server.txz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/andreao"
          tar -xJf "$RUNNER_TEMP/fleet-server.txz" -C "$RUNNER_TEMP/andreao"
          test -f "$RUNNER_TEMP/andreao/remote-v35/server.mjs"
      - name: Test real MP4 streaming, auth, retention and bad upload safety
        run: node --test "$RUNNER_TEMP/andreao/remote-v35/test/"*.test.mjs
      - name: Publish server source bundle as CI artifact (no deployment)
        uses: actions/upload-artifact@v4
        with:
          name: ANDREAO-Fleet-v3.5-Servidor-Source-Homologado
          path: fleet-remote-v35/server-sources.tar.xz.b64
          retention-days: 14
  approved-android-provenance:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Verify Android sources did not change after successful v3.4 build
        run: |
          set -euo pipefail
          git diff --exit-code HEAD^ HEAD -- android-fleet/
          echo "Nenhuma fonte Android alterada: ultimo build anterior continua aplicavel."
      - name: Recover previously compiled and tested v3.4 Android APK
        uses: actions/download-artifact@v4
        with:
          name: ANDREAO-Fleet-v3.4-APK-Integrado
          run-id: 44411160444
          github-token: ${{ github.token }}
          path: android-previously-approved
      - name: Verify original APK SHA-256 from green Android pipeline
        run: |
          set -euo pipefail
          echo "75031faecff395a44ad84ee2c2ece54873a84894bb924e58b0eeeefb5a34087b  android-previously-approved/app-debug.apk" | sha256sum -c -
          echo "APK v3.4 reaproveitado sem modificar bytes. Nao equivale a nova compilacao."
